<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo completo de productos obtenidos en tiempo real desde la API REST.">
    <title>Catálogo de Productos | Alta Tienda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./CSS/styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <a href="./index.html" class="marca-enlace" aria-label="Ir al inicio">
            <img src="./imagenes/logo.png" alt="Logo de Alta Tienda" class="logo">
        </a>

        <form action="./catalogo.html" method="get" class="Buscador" role="search" aria-label="Buscar en el catálogo">
            <label for="campo-buscar-catalogo" class="sr-only">Buscar en el catálogo</label>
            <input id="campo-buscar-catalogo" type="text" name="Buscar" placeholder="Buscar productos...">
            <button type="submit">Buscar</button>
        </form>

        <nav aria-label="Navegación principal">
            <ul class="nav-usuario">
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./catalogo.html" aria-current="page">Productos</a></li>
                <li><a href="./index.html#resenas">Reseñas</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./carrito.html">Carrito (<span id="contador-carrito">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="SeccionProductos" aria-labelledby="titulo-catalogo">
            <div class="encabezado-seccion">
                <h1 id="titulo-catalogo">Catálogo Completo</h1>
                <p id="estado-productos" role="status" aria-live="polite">Cargando catálogo...</p>
            </div>

            <div id="contenedor-productos-api" class="grid-productos-flex"></div>
        </section>
    </main>

    <footer>
        <a href="./index.html" class="marca-enlace" aria-label="Ir al inicio">
            <img src="./imagenes/logo.png" alt="Logo de Alta Tienda" class="logo">
        </a>
        <p class="copy">&copy; 2026 Alta Tienda. Todos los derechos reservados.</p>
        <nav aria-label="Navegación del pie de página">
            <ul class="nav-usuario">
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./catalogo.html">Productos</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./carrito.html">Carrito (<span class="contador-carrito-footer">0</span>)</a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
