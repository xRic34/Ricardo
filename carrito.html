<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Revisá los productos agregados a tu carrito, modificá cantidades o simulá tu compra.">
    <title>Carrito de Compras | Alta Tienda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./CSS/styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header>
        <a href="./index.html" class="marca-enlace" aria-label="Ir al inicio">
            <img src="./imagenes/logo.png" alt="Logo de Alta Tienda" class="logo">
        </a>

        <form action="./catalogo.html" method="get" class="Buscador" role="search" aria-label="Buscar productos">
            <label for="campo-buscar-carrito" class="sr-only">Buscar productos</label>
            <input id="campo-buscar-carrito" type="text" name="Buscar" placeholder="Buscar productos...">
            <button type="submit">Buscar</button>
        </form>

        <nav aria-label="Navegación principal">
            <ul class="nav-usuario">
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./catalogo.html">Productos</a></li>
                <li><a href="./index.html#resenas">Reseñas</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./carrito.html" aria-current="page">Carrito (<span id="contador-carrito">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="SeccionCarrito" aria-labelledby="titulo-carrito">
            <h1 id="titulo-carrito">Tu Carrito de Compras</h1>

            <div id="lista-carrito" class="lista-carrito"></div>

            <div id="resumen-carrito" class="resumen-carrito">
                <p class="total-carrito">Total de la compra: <strong id="total-carrito">$0.00</strong></p>
                <div class="acciones-carrito">
                    <button type="button" id="btn-simular-compra" class="boton">Simular compra</button>
                    <button type="button" id="btn-vaciar-carrito" class="boton boton-secundario">Vaciar carrito</button>
                </div>
                <p id="mensaje-carrito" role="status" aria-live="polite" class="mensaje-estado"></p>
            </div>
        </section>
    </main>

    <footer>
        <a href="./index.html" class="marca-enlace" aria-label="Ir al inicio">
            <img src="./imagenes/logo.png" alt="Logo de Alta Tienda" class="logo">
        </a>
        <p class="copy">&copy; 2026 Alta Tienda. Todos los derechos reservados.</p>
        <nav aria-label="Navegación del pie de página">
            <ul class="nav-usuario">
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./catalogo.html">Productos</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./carrito.html">Carrito (<span class="contador-carrito-footer">0</span>)</a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
